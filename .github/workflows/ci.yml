name: CI

# Runs the Pester tests, builds the unsigned MSI and Portable EXE with the
# existing packaging script, and smoke-tests the Portable EXE with no console
# attached (the condition that broke V2.2.7 startup). Built packages are
# uploaded as a workflow artifact for VM testing. release.yml calls this
# workflow and publishes exactly the artifact it produced.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release
  # build never cancels (or is cancelled by) a push-triggered CI run on main.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pester tests
        run: |
          $ErrorActionPreference = 'Stop'
          # Tests use Pester 3/4 syntax ('Should Be'); pin 4.x so the runner's Pester 5 is not picked up.
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $result = Invoke-Pester -Script .\tests -PassThru -OutputFormat NUnitXml -OutputFile TestResults.xml
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.dotnet\tools')

      - name: Build packages (unsigned)
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\Build-Packages.ps1

      - name: Smoke test Portable EXE without a console
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem -LiteralPath .\dist -Filter 'PcNinja-WinUpdateTool-Portable-*.exe' | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Portable EXE was not built.' }
          $startedAt = (Get-Date).AddSeconds(-2)

          # Win32_Process.Create starts the EXE under WmiPrvSE, so the launcher has no parent
          # console to attach to, the same as a double-click from Explorer.
          $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = '"{0}" -Mode Status -Json' -f $exe
              CurrentDirectory = (Split-Path -Parent $exe)
          }
          if ($created.ReturnValue -ne 0) { throw "Win32_Process.Create failed: $($created.ReturnValue)" }
          $procId = $created.ProcessId

          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Process -Id $procId -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
          }
          $stillRunning = [bool](Get-Process -Id $procId -ErrorAction SilentlyContinue)
          if ($stillRunning) { Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue }

          $logs = @(Get-ChildItem -Path 'C:\Users\*\AppData\Local\PcNinja\WinUpdateTool\Portable', "$env:SystemRoot\System32\config\systemprofile\AppData\Local\PcNinja\WinUpdateTool\Portable" -Recurse -Filter 'PortableLauncher.log' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -ge $startedAt })
          if ($logs.Count -eq 0) { throw 'No PortableLauncher.log was written by the smoke run.' }
          $text = ($logs | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"
          Write-Host $text

          if ($text -match 'Launcher failure') { throw 'Portable launcher reported a startup failure (see log above).' }
          if ($stillRunning) { throw 'Portable EXE did not exit within 120 seconds (likely blocked on an error dialog).' }
          if ($text -notmatch 'PowerShell runtime completed with exit code 0') { throw 'Portable runtime did not complete with exit code 0.' }
          Write-Host 'Portable EXE started and completed without a console.'

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PcNinja-WinUpdateTool-unsigned-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/*.msi
            dist/*.exe
            public-release/
            WinUpdate.Tool.by.PcNinja.Public.Release.zip
            WinUpdate.Tool.by.PcNinja.Public.Release.zip.sha256.txt
            TestResults.xml
